[colors]
background = #121A1D
background-alt = #373B41
foreground = #E4DDDB
primary = #F8D8CD
secondary = #8ABEB7
alert = #A54242
disabled = #2C434E

[bar/mybar]
bottom = true
width = 100%
height = 15pt
radius = 6
monitor = ${env:MONITOR:}
;tray-position = ${env:TRAY_POSITION:right}
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt

border-size = 0pt
border-color = #00000000
;border-color = #55F8D8CD

padding-left = 0
padding-right = 0

module-margin = 0

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:pixelsize=10;2
font-1 = Noto Sans Devanagari:size=9;2
font-2 = Droid Sans Fallback:size=9;2
font-3 = Font Awesome 6 Free Solid:pixelsize=10;2
font-4 = Siji:pixelsize=9;1
font-5 = Inconsolata Nerd Font Mono:style=Regular

;font-0 = DejaVu Sans Mono:size=9;2
;font-1 = Droid Sans Fallback:size=9;2
;font-2 = FontAwesome:size=9;3
;font-3 = Siji:pixelsize=9;1
;font-4 = Inconsolata Nerd Font Mono:style=Regular:size=10;2


modules-left = bspwm xwindow 
modules-center = now-playing
modules-right = filesystem pulseaudio xkeyboard memory cpu battery date tray

cursor-click = pointer
; cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

[bar/mybar_with_tray]
inherit = bar/mybar
modules-right = filesystem pulseaudio xkeyboard memory cpu battery date tray
[bar/mybar_no_tray]
inherit = bar/mybar
modules-right = filesystem pulseaudio xkeyboard memory cpu battery date

[module/bspwm]
type = internal/bspwm
occupied-scroll = true
pin-workspaces = true

label-monitor = %name%

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = -
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/xwindow]
type = internal/xwindow

label = %{T0}%title:0:20:...%%{T-}
label-maxlen = 50
label-padding-right = 2

[module/now-playing]
type = custom/script
tail = true
;format-prefix = ""
exec = /home/d093w1z/bin/polybar-now-playing/polybar-now-playing
click-right = "kill -USR1 $(pgrep --oldest --parent %pid%)"
click-left = ~/bin/focus-current-player.sh

[module/filesystem]
type = internal/fs
interval = 25
warn-percentage = 75

mount-0 = /
label-mounted = %{F#F0C674}%mountpoint%%{F-}%percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

;format-volume-prefix = " "
format-volume-foreground = ${colors.primary}
format-volume = <ramp-volume> <label-volume>
click-right = pavucontrol
label-volume = %percentage%%
label-volume-minlen = 4
label-volume-alignment = right

label-muted = " ---%"
label-muted-minlen = 4
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2

format = <label> <bar-used>
label = %{T3}%{T-} %percentage_used%%
label-foreground = ${colors.primary}

bar-used-width = 10
bar-used-foreground-0 = #0df220
bar-used-foreground-1 = #4bf13d
bar-used-foreground-2 = #89f05a
bar-used-foreground-3 = #c0ee72
bar-used-foreground-4 = #eed056
bar-used-foreground-5 = #f4ba31
bar-used-foreground-6 = #fba523
bar-used-foreground-7 = #fc721c
bar-used-foreground-8 = #fd4014
bar-used-foreground-9 = #ff0d0d

bar-used-indicator = |
bar-used-indicator-font = 0
bar-used-indicator-foreground = ${colors.foreground}

bar-used-fill = ━
bar-used-fill-font = 0

bar-used-empty = ─
bar-used-empty-font = 0
bar-used-empty-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu

format = <label><ramp-coreload>
format-font = 1
format-foreground = ${colors.primary}
label = %percentage%%
label-minlen = 5
label-alignment = right
warn-percentage = 90

ramp-coreload-spacing = 1px
ramp-coreload-0 = ▁
ramp-coreload-0-font = 1
ramp-coreload-0-foreground = #0df220
ramp-coreload-1 = ▂
ramp-coreload-1-font = 1
ramp-coreload-1-foreground = #0df220
ramp-coreload-2 = ▃
ramp-coreload-2-font = 1
ramp-coreload-2-foreground = #aaff77
ramp-coreload-3 = ▄
ramp-coreload-3-font = 1
ramp-coreload-3-foreground = #aaff77
ramp-coreload-4 = ▅
ramp-coreload-4-font = 1
ramp-coreload-4-foreground = #fba922
ramp-coreload-5 = ▆
ramp-coreload-5-font = 1
ramp-coreload-5-foreground = #fba922
ramp-coreload-6 = ▇
ramp-coreload-6-font = 1
ramp-coreload-6-foreground = #ff5555
ramp-coreload-7 = █
ramp-coreload-7-font = 1
ramp-coreload-7-foreground = #ff0d0d

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%


[module/date]
type = internal/date
interval = 1

date = %l:%M%p
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini


[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 30

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 2


format-charging = <animation-charging> <label-charging>
;format-charging-background = ${colors.foreground}
format-charging-font = 5

format-discharging = <ramp-capacity> <label-discharging>
;format-discharging-background = ${colors.foreground}

format-full = %{F#FF0000}<ramp-capacity> <label-full>%{F-}
;format-full-background = ${colors.foreground}

label-charging = %percentage%% %time%h
label-discharging = %percentage%% %time%h
ramp-capacity-0 = 
ramp-capacity-0-foreground = #f53c3c
ramp-capacity-1 = 
ramp-capacity-1-foreground = #ffa900
ramp-capacity-2 = 
ramp-capacity-2-foreground = #F2E70D
ramp-capacity-3 = 
ramp-capacity-3-foreground = #BDF20D
ramp-capacity-4 = 
;ramp-capacity-4-foreground = #3cf53c
ramp-capacity-4-foreground = #0df220

;bar-capacity-width = 10
;bar-capacity-format = %{+u}%{+o}%fill%%empty%%{-u}%{-o}
;bar-capacity-fill = █
;bar-capacity-fill-foreground = #ddffffff
;bar-capacity-fill-font = 4
;bar-capacity-empty = █
;bar-capacity-empty-font = 4
;bar-capacity-empty-foreground = #44ffffff

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 500

[module/tray]
type = internal/tray

tray-size = 20px
format-margin = 4px
tray-spacing = 8px
